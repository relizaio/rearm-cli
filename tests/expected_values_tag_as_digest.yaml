# digest/sha key (e.g. the Dependency-Track v2 chart).
apiServer:
  image:
    registry: docker.io
    repository: dependencytrack/apiserver
    tag: 5.0.9@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    pullPolicy: IfNotPresent
  topology: monolith
frontend:
